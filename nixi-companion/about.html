<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About heynixi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #f2f4f8;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #1e293b;
    }

    /* Top Titlebar */
    .titlebar {
      height: 42px;
      background: #111216;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      -webkit-app-region: drag;
      flex: none;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e5e7eb;
      font-size: 13.5px;
      font-weight: 500;
    }

    .title-dots {
      color: #94a3b8;
      letter-spacing: 2px;
      font-size: 13px;
    }

    .title-close {
      -webkit-app-region: no-drag;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .title-close:hover {
      background: #ef4444;
      color: #ffffff;
    }

    /* Content Area */
    .content {
      flex: 1;
      padding: 28px 32px 24px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Branding Row */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .nixi-capsule {
      width: 72px;
      height: 40px;
      background: #000000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      flex: none;
    }

    .capsule-eye {
      width: 7px;
      height: 15px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
      animation: eyeBlink 4s infinite;
    }

    @keyframes eyeBlink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.12); }
    }

    .brand-text h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 15.5px;
      color: #64748b;
      margin-top: 3px;
    }

    /* Version & Build Info */
    .build-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14.5px;
      color: #1e293b;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .desc-text {
      font-size: 14px;
      color: #64748b;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .data-path {
      font-size: 13.5px;
      color: #94a3b8;
      font-family: inherit;
      margin-bottom: 20px;
      word-break: break-all;
    }

    /* Bottom Button */
    .btn-close {
      width: 100%;
      background: #111216;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: background 0.15s, transform 0.1s;
    }

    .btn-close:hover {
      background: #1e293b;
    }

    .btn-close:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <div class="titlebar">
    <div class="title-left">
      <span class="title-dots">● ●</span>
      <span>About heynixi</span>
    </div>
    <button class="title-close" id="bCloseTop" title="Close">✕</button>
  </div>

  <div class="content">
    <div>
      <div class="brand-row">
        <canvas id="aboutFace" width="144" height="80" style="width: 72px; height: 40px; border-radius: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.4); display: block;" title="Nixi looking at you"></canvas>
        <div class="brand-text">
          <h1>heynixi</h1>
          <p>Your voice, in control.</p>
        </div>
      </div>

      <div class="build-info">
        <div>Version 0.2.1</div>
        <div>Build 19c58a334383</div>
        <div>Built 2026-10-18T20:56:26.7743968Z</div>
      </div>

      <div class="desc-text">
        Command, Dictate and Write in one pill at the top of your screen.<br>
        Speech and AI run on this PC.
      </div>

      <div class="data-path">
        Local data: C:\Users\ACER\AppData\Local\heynixi
      </div>
    </div>

    <button class="btn-close" id="bCloseBottom">Close</button>
  </div>

  <script src="face.js"></script>
  <script>
    const { ipcRenderer } = require('electron');

    const closeWin = () => ipcRenderer.send('close-about');
    document.getElementById('bCloseTop').onclick = closeWin;
    document.getElementById('bCloseBottom').onclick = closeWin;

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeWin();
    });

    // Eye follow cursor physics
    const canvas = document.getElementById('aboutFace');
    const ctx = canvas.getContext('2d');
    const face = new Face();
    face.setPalette('#ffffff', '#000000');
    let targetOv = [0, 0];

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / (window.innerWidth / 2);
      const dy = (e.clientY - cy) / (window.innerHeight / 2);
      targetOv = [Math.max(-1, Math.min(1, dx * 1.5)), Math.max(-1, Math.min(1, dy * 1.5))];
    });

    let lastT = 0;
    function loop(t) {
      requestAnimationFrame(loop);
      const dt = (t - lastT) / 1000;
      lastT = t;
      if (!dt || dt > 0.5) return;
      face.advance(dt, 'idle', 0, targetOv);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, 144, 80);
      ctx.setTransform(2, 0, 0, 2, 0, 0);

      // Black pill background
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.roundRect(0, 0, 72, 40, 20);
      ctx.fill();

      face.paint(ctx, 0, 0, 72, 40, { time: t / 1000 });
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
